# Fly.io deployment config for ALUNAMDA Invoicing System
# https://fly.io/docs/reference/configuration/

app = "alunamda-invoicing"
primary_region = "lhr"  # London - closest free-tier region to South Africa

# ==========================================
# Build
# ==========================================
[build]
  dockerfile = "Dockerfile"
  ignorefile = ".dockerignore"

# ==========================================
# HTTP Service
# ==========================================
[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"      # Stop when idle (free tier)
  auto_start_machines = true       # Auto-start on request
  min_machines_running = 0         # Scale to 0 when idle (free tier)
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    hard_limit = 50
    soft_limit = 40

  kill_signal = "SIGTERM"
  kill_timeout = "30s"

  # Health check
  [[http_service.checks]]
    grace_period = "15s"
    interval = "30s"
    method = "GET"
    path = "/api/health"
    timeout = "10s"

# ==========================================
# Machine settings
# ==========================================
[machine]

  [[machine.mounts]]
    source = "alunamda_data"
    destination = "/data"

# ==========================================
# Environment
# ==========================================
[env]
  APP_NAME = "ALUNAMDA Invoicing"
  BASE_URL = "https://alunamda-invoicing.fly.dev"
  ALUNAMDA_PORT = "8000"
  DATA_DIR = "/data"
  DEBUG = "false"
  SESSION_EXPIRE_MINUTES = "1440"
  ITEMS_PER_PAGE = "25"
  ACTIVITY_PER_PAGE = "50"
  # Generate a new SECRET_KEY before deploying:
  # fly secrets set SECRET_KEY=$(openssl rand -hex 32)
  SECRET_KEY = "CHANGE_ME_BEFORE_DEPLOY"

# Secrets (set these via fly secrets set)
# fly secrets set SECRET_KEY="your-random-key-here"
# fly secrets set CSRF_SECRET_KEY="your-random-key-here"
