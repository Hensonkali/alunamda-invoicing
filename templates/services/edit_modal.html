<div class="bg-white rounded-xl shadow-xl w-full max-w-md p-6 space-y-4">
    <h2 class="text-lg font-semibold text-gray-900">Edit Service</h2>
    <form hx-post="/services/{{ svc.id }}/edit" hx-target="body" hx-swap="outerHTML" class="space-y-4">
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Name *</label>
            <input type="text" name="name" value="{{ svc.name }}" required class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none">
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Description</label>
            <textarea name="description" rows="2" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none">{{ svc.description }}</textarea>
        </div>
        <div class="grid grid-cols-2 gap-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Unit Price (ZAR)</label>
                <input type="number" name="unit_price" step="0.01" value="{{ svc.unit_price }}" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">VAT Rate (%)</label>
                <input type="number" name="vat_rate" step="0.1" value="{{ svc.vat_rate }}" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none">
            </div>
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Category</label>
            <select name="category" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none">
                {% for cat in ["General", "CIPC", "Accounting", "Tax", "Payroll", "Secretarial", "Advisory"] %}
                <option {{ "selected" if svc.category == cat }}>{{ cat }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="flex items-center gap-3">
            <input type="checkbox" name="is_active" id="edit_is_active" value="true" {{ "checked" if svc.is_active }} class="w-4 h-4 text-primary border-gray-300 rounded focus:ring-primary">
            <label for="edit_is_active" class="text-sm font-medium text-gray-700">Active</label>
        </div>
        <div class="flex justify-end gap-3 pt-2">
            <button type="button" onclick="document.getElementById('editModal').classList.add('hidden')" class="px-4 py-2 border border-gray-300 rounded-lg text-sm text-gray-600 hover:bg-gray-50">Cancel</button>
            <button type="submit" class="btn-primary text-sm">Save Changes</button>
        </div>
    </form>
</div>
